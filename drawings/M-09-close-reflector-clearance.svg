<text x="1166.000" y="699.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#192A37">2M-R EDGE</text>
<text x="1433.000" y="699.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1F5B94">70-R EDGE</text>
<text x="1036.000" y="726.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#192A37">CHECK AFTER FINAL M-08 BOOM RETENTION.</text>
<text x="1036.000" y="748.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#192A37">INCLUDE ACTUAL BLADE WIDTH, CURVE, AND MOUNT ANGLE.</text>
<text x="1036.000" y="775.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#A7662F">CENTER DELTA OR PAD GAP CANNOT SUBSTITUTE FOR THIS.</text>
