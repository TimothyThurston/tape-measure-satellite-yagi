<text x="803.000" y="870.000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#657582">ACTUAL</text>
<line x1="58.000" y1="876.000" x2="984.000" y2="876.000" stroke="#D6DEE4" stroke-width="1"/>
<text x="60.000" y="891.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="normal" text-anchor="start" fill="#192A37">2M-R FRONT X</text>
<text x="474.000" y="891.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="normal" text-anchor="start" fill="#192A37">21.500 +/- 0.0625</text>
<line x1="803.000" y1="893.000" x2="969.000" y2="893.000" stroke="#657582" stroke-width="0.7"/>
<text x="60.000" y="908.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="normal" text-anchor="start" fill="#192A37">70-R FRONT X</text>
<text x="474.000" y="908.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="normal" text-anchor="start" fill="#192A37">21.000 +/- 0.03125</text>
<line x1="803.000" y1="910.000" x2="969.000" y2="910.000" stroke="#657582" stroke-width="0.7"/>
<text x="60.000" y="925.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="bold" text-anchor="start" fill="#192A37">DELTA X = X(2M-R) - X(70-R)</text>
<text x="474.000" y="925.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="bold" text-anchor="start" fill="#192A37">0.500 +/- 0.03125</text>
<line x1="803.000" y1="927.000" x2="969.000" y2="927.000" stroke="#657582" stroke-width="0.7"/>
<text x="60.000" y="942.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="bold" text-anchor="start" fill="#192A37">MIN PHYSICAL EDGE GAP</text>
<text x="474.000" y="942.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="bold" text-anchor="start" fill="#192A37">&gt;= 0.0625</text>
<line x1="803.000" y1="944.000" x2="969.000" y2="944.000" stroke="#657582" stroke-width="0.7"/>
<rect x="1018.000" y="816.000" width="640.000" height="130.000" stroke="#D6DEE4" fill="none" stroke-width="1.2"/>
<text x="1034.000" y="844.000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#192A37">INSPECTION / STOP RULE</text>
<text x="1640.000" y="844.000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#657582">O6 STEP 14</text>
<text x="1036.000" y="860.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="normal" text-anchor="start" fill="#192A37">1. ALIGN FRONTS; PARALLEL BOOMS; REAR OFFSET &lt;= 0.03125.</text>
<text x="1036.000" y="876.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="normal" text-anchor="start" fill="#192A37">2. READ EACH FRONT X; REAR CHECK |XF+XR-L| &lt;= 0.03125.</text>
<text x="1036.000" y="892.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="normal" text-anchor="start" fill="#192A37">3. COMPUTE DELTA X; BOTH STATION LIMITS ALSO APPLY.</text>
<text x="1036.000" y="908.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="bold" text-anchor="start" fill="#192A37">4. GAUGE / RECORD THE CLOSEST ACTUAL EDGE GAP.</text>
<text x="1036.000" y="924.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="bold" text-anchor="start" fill="#A7662F">5. FAIL? STOP / DOCUMENT; ENGINEERING REVIEW.</text>
<text x="1036.000" y="940.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="bold" text-anchor="start" fill="#A7662F">6. NO BEND / NOTCH / OFFSET / SHORTEN WITHOUT REVISION.</text>
<line x1="30.000" y1="960.000" x2="1670.000" y2="960.000" stroke="#192A37" stroke-width="2"/>
<text x="48.000" y="982.000" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#192A37">GENERAL NOTES</text>
<text x="48.000" y="1004.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">1. ALL DIMENSIONS IN INCHES. ONLY VIEW A RELATIVE X INTERVAL IS 4:1; REST NTS.</text>
<text x="48.000" y="1023.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">2. 2M-R: 41.400 CUT + ST-3; 70-R: 12.900 TAPE ONLY. SEE M-04 / M-05.</text>
<text x="48.000" y="1042.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">3. ALSO REQUIRE &gt;= 0.125 CLEARANCE FROM EITHER BOOM TO OTHER-BOOM COMPONENTS.</text>
