<text x="520.000" y="613.000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#192A37">ELEMENT PLANES: 90 +/- 2 DEG</text>
<text x="520.000" y="644.000" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" text-anchor="start" fill="#192A37">BOOM-CENTER LINE: 45 +/- 5 DEG TO EACH</text>
<text x="520.000" y="675.000" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" text-anchor="start" fill="#192A37">BOOMS PARALLEL; FRONT FACES FLUSH</text>
<text x="520.000" y="706.000" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" text-anchor="start" fill="#657582">TAPE / SUPPORT SHAPES TRUNCATED</text>
<text x="520.000" y="737.000" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="bold" text-anchor="start" fill="#A7662F">THIS PROJECTION CANNOT PROVE EDGE GAP</text>
<text x="60.000" y="780.000" font-family="Arial, Helvetica, sans-serif" font-size="10.4" font-weight="normal" text-anchor="start" fill="#657582">ACTUAL REFLECTORS ARE AT DIFFERENT X STATIONS; INSPECT THE BUILT 3D ASSEMBLY.</text>
<rect x="1018.000" y="530.000" width="640.000" height="270.000" stroke="#D6DEE4" fill="none" stroke-width="1.2"/>
