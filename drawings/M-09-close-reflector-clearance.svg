<text x="1640.000" y="559.000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#657582">SCHEMATIC / NTS</text>
<text x="1036.000" y="584.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#192A37">MEASURE THE ACTUAL CLOSEST TAPE-EDGE APPROACH.</text>
