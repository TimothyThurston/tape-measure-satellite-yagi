<text x="60.000" y="492.000" font-family="Arial, Helvetica, sans-serif" font-size="10.7" font-weight="normal" text-anchor="start" fill="#192A37">70-R IS 0.500 IN NOMINALLY FORWARD OF 2M-R. STATION MARKS DO NOT SHOW TAPE WIDTH OR EDGE GAP.</text>
