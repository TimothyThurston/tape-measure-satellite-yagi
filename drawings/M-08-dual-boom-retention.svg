<text x="1036.000" y="704.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#192A37">INSTALLED PAD THICKNESS &gt;= 0.375; REPLACE IF COMPRESSED.</text>
<text x="1036.000" y="727.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#192A37">PAD LONG AXIS PARALLEL TO BOOMS; CENTER PAD AND TIE.</text>
<text x="1036.000" y="750.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#A7662F">USE UV-RESISTANT 8 in MIN TIE; 4 / 6 in TIES PROHIBITED.</text>
<text x="1036.000" y="773.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#192A37">NO BOOM HOLES, HINGE, TEE, CROSSBAR, BOLT, OR ADHESIVE.</text>
