<text x="1640.000" y="844.000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#657582">O6 STEPS 13-14</text>
<text x="1036.000" y="865.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">1. ALIGN FRONTS; SET PLANES AND 45 DEG BOOM RELATION.</text>
<text x="1036.000" y="885.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">2. FIT PAD-1 / TIE AT J1, THEN PAD-2 / NEW TIE AT J2.</text>
<text x="1036.000" y="905.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">3. HAND PULL / TWIST; CHECK GAPS, CLEARANCES, PVC.</text>
<text x="1036.000" y="925.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">4. HEADS AWAY FROM HAND / COAX / RF; TRIM TAILS FLUSH.</text>
<text x="1036.000" y="942.000" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="bold" text-anchor="start" fill="#A7662F">FOR STORAGE, CUT BOTH TIES; USE NEW TIES TO REASSEMBLE.</text>
