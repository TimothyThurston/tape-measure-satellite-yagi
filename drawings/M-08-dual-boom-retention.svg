<text x="984.000" y="844.000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#657582">O5 / O6</text>
<text x="60.000" y="864.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="normal" text-anchor="start" fill="#192A37">1. FRONT FACES FLUSH; REAR OFFSET &lt;= 0.03125; LENGTH PAIR DIFFERENCE &lt;= 0.03125.</text>
<text x="60.000" y="882.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="normal" text-anchor="start" fill="#192A37">2. CENTERLINES PARALLEL; PLANES 90 +/- 2 DEG; CENTER LINE 45 +/- 5 DEG.</text>
<text x="60.000" y="900.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="bold" text-anchor="start" fill="#192A37">3. J1 / J2 BARE-PVC GAP &gt;= 0.375; NO AXIAL SLIP, ROTATION, OR PVC INDENT.</text>
<text x="60.000" y="918.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="normal" text-anchor="start" fill="#192A37">4. OTHER-BOOM COMPONENT CLEARANCE &gt;= 0.125; TIES / PADS CLEAR ALL RF.</text>
<text x="60.000" y="936.000" font-family="Arial, Helvetica, sans-serif" font-size="9.9" font-weight="bold" text-anchor="start" fill="#192A37">5. REFLECTOR CENTER SEP 0.500 +/- 0.03125; PHYSICAL EDGE GAP &gt;= 0.0625 (M-09).</text>
