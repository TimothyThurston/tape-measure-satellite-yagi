<text x="48.000" y="1004.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">1. ALL DIMENSIONS IN INCHES; BOOM LENGTH AT 1:2; PAD SYMBOL / OTHER VIEWS NTS.</text>
<text x="48.000" y="1023.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">2. EACH BOOM 30.000 +/- 0.0625; KEEP BOTH INTACT AND PARALLEL IN USE.</text>
<text x="48.000" y="1042.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">3. COAX ROUTES REARWARD CLEAR OF BOTH TIE / PAD INTERFACES.</text>
