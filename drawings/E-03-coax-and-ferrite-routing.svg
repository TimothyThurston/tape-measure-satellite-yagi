<rect x="1462.000" y="276.000" width="148.000" height="34.000" stroke="#192A37" fill="#FFFFFF" stroke-width="1.5"/>
<text x="1536.000" y="298.000" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="bold" text-anchor="middle" fill="#192A37">BNC MALE  '2 m'</text>
<text x="390.000" y="342.000" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#657582">INTACT JACKET</text>
<text x="459.000" y="360.000" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#A7662F">RELIEF TIE</text>
<text x="615.000" y="342.000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#192A37">4x 31 MATERIAL</text>
<text x="615.000" y="360.000" font-family="Arial, Helvetica, sans-serif" font-size="9.1" font-weight="normal" text-anchor="middle" fill="#657582">0431164281 OR VERIFIED EQUIV.</text>
<text x="1055.000" y="342.000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#657582">REAR RUN: DRY-FIT CLEAR OF J2 / ELEMENTS</text>
<text x="1536.000" y="342.000" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#657582">FREE MOVEMENT SLACK</text>
<rect x="60.000" y="389.000" width="1580.000" height="151.000" stroke="#D6DEE4" fill="#EAF1F7" stroke-width="1"/>
<text x="78.000" y="415.000" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1F5B94">70 cm INDEPENDENT FEED</text>
<text x="1616.000" y="415.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#657582">FRONT / FEED  -&gt;  REAR / OPERATOR</text>
<rect x="82.000" y="429.000" width="268.000" height="66.000" stroke="#1F5B94" fill="#FFFFFF" stroke-width="1.5"/>
<text x="216.000" y="451.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1F5B94">70-DE  |  X = 18.500 FROM FRONT</text>
<text x="216.000" y="471.000" font-family="Arial, Helvetica, sans-serif" font-size="10.1" font-weight="normal" text-anchor="middle" fill="#192A37">CENTER -&gt; A  |  BRAID -&gt; B</text>
<text x="216.000" y="488.000" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="normal" text-anchor="middle" fill="#657582">70 cm DIRECT FEED: SEE E-01</text>
<line x1="350.000" y1="462.000" x2="1453.000" y2="462.000" stroke="#1F5B94" stroke-width="4"/>
<rect x="452.000" y="444.000" width="14.000" height="36.000" stroke="#A7662F" fill="#FFFFFF" stroke-width="2"/>
<rect x="548.000" y="443.000" width="27.000" height="38.000" stroke="#1F5B94" fill="#FFFFFF" stroke-width="1.7"/>
