<rect x="618.000" y="443.000" width="27.000" height="38.000" stroke="#1F5B94" fill="#FFFFFF" stroke-width="1.7"/>
<rect x="653.000" y="443.000" width="27.000" height="38.000" stroke="#1F5B94" fill="#FFFFFF" stroke-width="1.7"/>
<line x1="1440.000" y1="454.000" x2="1453.000" y2="462.000" stroke="#1F5B94" stroke-width="2"/>
<line x1="1440.000" y1="470.000" x2="1453.000" y2="462.000" stroke="#1F5B94" stroke-width="2"/>
<rect x="1462.000" y="445.000" width="148.000" height="34.000" stroke="#1F5B94" fill="#FFFFFF" stroke-width="1.5"/>
<text x="1536.000" y="467.000" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="bold" text-anchor="middle" fill="#1F5B94">BNC MALE  '70 cm'</text>
<text x="390.000" y="511.000" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#657582">INTACT JACKET</text>
<text x="459.000" y="529.000" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#A7662F">RELIEF TIE</text>
<text x="615.000" y="511.000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1F5B94">4x 61 MATERIAL</text>
<text x="615.000" y="529.000" font-family="Arial, Helvetica, sans-serif" font-size="9.1" font-weight="normal" text-anchor="middle" fill="#657582">0461164281 OR VERIFIED EQUIV.</text>
<text x="1055.000" y="511.000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#657582">REAR RUN: DRY-FIT CLEAR OF J2 / ELEMENTS</text>
<text x="1536.000" y="511.000" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#657582">FREE MOVEMENT SLACK</text>
<text x="60.000" y="564.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="bold" text-anchor="start" fill="#A7662F">CABLE PATHS, BEND LOCATIONS, FERRITE POSITIONS, AND SLACK ARE SET BY ACTUAL DRY FIT AND RECORDED AS BUILT.</text>
<rect x="42.000" y="596.000" width="760.000" height="219.000" stroke="#D6DEE4" fill="none" stroke-width="1.2"/>
<text x="58.000" y="625.000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#192A37">O7 FEED-ENTRY GATE</text>
<text x="786.000" y="625.000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#657582">BEFORE EITHER ANTENNA-END BNC IS REMOVED</text>
<text x="60.000" y="653.000" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#192A37">1. CONFIRM BOTH 50 OHM RG-58; FACTORY BNC CONTINUITY / SHORT TESTS PASS.</text>
<text x="60.000" y="675.000" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#192A37">2. RECORD ACTUAL JACKET OD, MAKER / MODEL, AND PUBLISHED MIN BEND RADIUS</text>
<text x="60.000" y="697.000" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#192A37">   IF AVAILABLE; CHECK BOTH CABLES FOR DAMAGE.</text>
<text x="60.000" y="719.000" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#192A37">3. VERIFY FOUR INITIAL FERRITES PER FEED: 31 ON 2 m, 61 ON 70 cm</text>
<text x="60.000" y="741.000" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#192A37">   OR APPROVED EQUIVALENTS WITH MANUFACTURER DATA.</text>
<text x="60.000" y="763.000" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#192A37">4. CHECK EACH SNAP-ON FIT / LATCH ON THE REAL CABLE; NO CRUSH.</text>
<text x="60.000" y="785.000" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#192A37">5. DRY-FIT BOTH INTACT CABLES, FERRITES, AND LOCAL STRAIN RELIEF.</text>
<text x="60.000" y="802.000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#A7662F">FAIL? RECORD IN O4 SEC. 11 AND STOP BEFORE CUTTING EITHER CABLE.</text>
<rect x="820.000" y="596.000" width="838.000" height="219.000" stroke="#D6DEE4" fill="none" stroke-width="1.2"/>
<text x="836.000" y="625.000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#192A37">INSTALLATION / CLEARANCE RULES</text>
<text x="1640.000" y="625.000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#657582">O3 SEC. 14 / O5 SEC. 12</text>
<text x="838.000" y="653.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="normal" text-anchor="start" fill="#192A37">1. JACKET CLOSE TO NODES; LOCAL STRAIN RELIEF BEFORE FERRITES.</text>
<text x="838.000" y="675.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="normal" text-anchor="start" fill="#192A37">2. DO NOT LOAD ELECTRICAL NODES; FERRITES NEAR FEED, BEFORE REAR RUN.</text>
<text x="838.000" y="697.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="normal" text-anchor="start" fill="#192A37">3. OBEY CABLE MAKER'S MINIMUM BEND RADIUS; NO TIGHT BOOM COILS.</text>
<text x="838.000" y="719.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="normal" text-anchor="start" fill="#192A37">4. CLEAR ELEMENT TIPS, HAIRPIN, J1/J2, AND THE OTHER FEEDPOINT.</text>
<text x="838.000" y="741.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="bold" text-anchor="start" fill="#192A37">5. CROSS-BOOM PART CLEARANCE &gt;= 0.125 IN; MEASURE ON ASSEMBLY.</text>
<text x="838.000" y="763.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="normal" text-anchor="start" fill="#192A37">6. SMALL ~4 IN TIES: LOCAL ONLY, NEVER AROUND BOTH BOOMS.</text>
<text x="838.000" y="785.000" font-family="Arial, Helvetica, sans-serif" font-size="9.7" font-weight="normal" text-anchor="start" fill="#192A37">7. KEEP FREE REAR CABLE FOR NORMAL HANDHELD MOVEMENT.</text>
<text x="838.000" y="802.000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#A7662F">O8 COAX-MOVEMENT TEST SETS FINAL FERRITE COUNT / POSITION.</text>
<rect x="42.000" y="832.000" width="1616.000" height="114.000" stroke="#D6DEE4" fill="none" stroke-width="1.2"/>
<text x="58.000" y="860.000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#192A37">AS-BUILT ROUTE / O8 RECORD</text>
<text x="1640.000" y="860.000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#657582">ENTER ACTUAL VALUES; INITIAL FERRITE COUNT = FOUR PER FEED</text>
<text x="60.000" y="881.000" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="bold" text-anchor="start" fill="#657582">FEED</text>
<text x="187.000" y="881.000" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="bold" text-anchor="start" fill="#657582">CABLE OD / MAKER / BEND LIMIT</text>
<text x="614.000" y="881.000" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="bold" text-anchor="start" fill="#657582">FERRITE GRADE / FIT / POSITION</text>
<text x="1056.000" y="881.000" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="bold" text-anchor="start" fill="#657582">TIES / ROUTE / MIN CROSS-BOOM GAP</text>
<text x="1420.000" y="881.000" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="bold" text-anchor="start" fill="#657582">O8 MOVEMENT / FINAL QTY</text>
<line x1="58.000" y1="888.000" x2="1640.000" y2="888.000" stroke="#D6DEE4" stroke-width="1"/>
<text x="60.000" y="910.000" font-family="Arial, Helvetica, sans-serif" font-size="10.1" font-weight="bold" text-anchor="start" fill="#192A37">2 m</text>
<line x1="187.000" y1="913.000" x2="581.000" y2="913.000" stroke="#657582" stroke-width="0.7"/>
<line x1="614.000" y1="913.000" x2="1019.000" y2="913.000" stroke="#657582" stroke-width="0.7"/>
<line x1="1056.000" y1="913.000" x2="1387.000" y2="913.000" stroke="#657582" stroke-width="0.7"/>
<line x1="1420.000" y1="913.000" x2="1638.000" y2="913.000" stroke="#657582" stroke-width="0.7"/>
<text x="60.000" y="936.000" font-family="Arial, Helvetica, sans-serif" font-size="10.1" font-weight="bold" text-anchor="start" fill="#1F5B94">70 cm</text>
<line x1="187.000" y1="939.000" x2="581.000" y2="939.000" stroke="#657582" stroke-width="0.7"/>
<line x1="614.000" y1="939.000" x2="1019.000" y2="939.000" stroke="#657582" stroke-width="0.7"/>
<line x1="1056.000" y1="939.000" x2="1387.000" y2="939.000" stroke="#657582" stroke-width="0.7"/>
<line x1="1420.000" y1="939.000" x2="1638.000" y2="939.000" stroke="#657582" stroke-width="0.7"/>
<line x1="30.000" y1="960.000" x2="1670.000" y2="960.000" stroke="#192A37" stroke-width="2"/>
<text x="48.000" y="982.000" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#192A37">GENERAL NOTES</text>
<text x="48.000" y="1004.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">1. ROUTE GRAPHICS ARE SCHEMATIC; NO CABLE CUT LENGTH, TIE STATION, OR BEND RADIUS IS ASSIGNED.</text>
<text x="48.000" y="1023.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">2. REMOVE ONLY THE ANTENNA-SIDE BNC AFTER THE O7 GATE; RETAIN AND LABEL EACH OPERATOR-END BNC.</text>
<text x="48.000" y="1042.000" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" text-anchor="start" fill="#192A37">3. FINAL RF ACCEPTANCE NEEDS O8 MEASUREMENTS; LOW SWR ALONE DOES NOT PROVE COMMON-MODE CONTROL.</text>
<line x1="905.000" y1="960.000" x2="905.000" y2="1070.000" stroke="#192A37" stroke-width="1.4"/>
<line x1="1178.000" y1="960.000" x2="1178.000" y2="1070.000" stroke="#192A37" stroke-width="1.4"/>
<line x1="1398.000" y1="960.000" x2="1398.000" y2="1070.000" stroke="#192A37" stroke-width="1.4"/>
<text x="922.000" y="984.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#657582">SOURCE BASELINE</text>
<text x="922.000" y="1007.000" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#192A37">O3/O4/O5/O6 REV L</text>
<text x="922.000" y="1030.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#657582">COMMIT 186c773</text>
<text x="1195.000" y="984.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#657582">SCALE AT 100% PRINT</text>
<text x="1195.000" y="1007.000" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#192A37">SCHEMATIC / NTS</text>
<text x="1195.000" y="1030.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#192A37">17 x 11 IN SHEET</text>
<text x="1415.000" y="984.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#657582">ISSUE / DATE</text>
<text x="1415.000" y="1007.000" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#1F5B94">REV A - FOR REVIEW</text>
<text x="1415.000" y="1030.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#192A37">2026-10-12</text>
<text x="1648.000" y="1055.000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#192A37">SHEET E-03</text>
