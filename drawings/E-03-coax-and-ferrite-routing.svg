<text x="58.000" y="177.000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#192A37">VIEW A  |  TWO REARWARD CABLE PATHS</text>
<text x="1640.000" y="177.000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#657582">ORDER / TOPOLOGY ONLY; NOT TO SCALE</text>
<text x="60.000" y="205.000" font-family="Arial, Helvetica, sans-serif" font-size="10.7" font-weight="bold" text-anchor="start" fill="#192A37">ONE 6 FT, 50 OHM RG-58 FACTORY BNC MALE-TO-MALE CABLE PER BAND. KEEP FEEDS SEPARATE; NO PASSIVE BNC TEE.</text>
<rect x="60.000" y="220.000" width="1580.000" height="151.000" stroke="#D6DEE4" fill="#E8EDF0" stroke-width="1"/>
<text x="78.000" y="246.000" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#192A37">2 m INDEPENDENT FEED</text>
<text x="1616.000" y="246.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#657582">FRONT / FEED  -&gt;  REAR / OPERATOR</text>
<rect x="82.000" y="260.000" width="268.000" height="66.000" stroke="#192A37" fill="#FFFFFF" stroke-width="1.5"/>
<text x="216.000" y="282.000" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#192A37">2M-DE  |  X = 13.500 FROM FRONT</text>
<text x="216.000" y="302.000" font-family="Arial, Helvetica, sans-serif" font-size="10.1" font-weight="normal" text-anchor="middle" fill="#192A37">CENTER -&gt; A  |  BRAID -&gt; B</text>
<text x="216.000" y="319.000" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="normal" text-anchor="middle" fill="#657582">2 m HAIRPIN: SEE E-02</text>
